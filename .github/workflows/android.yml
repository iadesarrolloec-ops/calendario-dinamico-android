name: Compilar CALENDARIO DINAMICO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p build-src
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d build-src

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        working-directory: build-src/calendario-dinamico
        run: npm install

      - name: Sincronizar Capacitor
        working-directory: build-src/calendario-dinamico
        run: npx cap sync android

      - name: Dar permisos a Gradle
        working-directory: build-src/calendario-dinamico/android
        run: chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: build-src/calendario-dinamico/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CALENDARIO-DINAMICO-APK
          path: build-src/calendario-dinamico/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
